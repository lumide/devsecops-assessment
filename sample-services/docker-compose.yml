version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  account-service:
    build:
      context: ../sample-services/account-service
      dockerfile: ../../implementation/docker/account-service.Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mydb
      DB_USER: admin
      DB_PASSWORD: password
    depends_on:
      - postgres
    ports:
      - "8081:8081"

  payment-service:
    build:
      context: ../sample-services/payment-service
      dockerfile: ../../implementation/docker/payment-service.Dockerfile
    environment:
      ACCOUNT_SERVICE_URL: "http://account-service:8081"
    depends_on:
      - account-service
    ports:
      - "8080:8080"

  transaction-service:
    build:
      context: ../sample-services/transaction-service
      dockerfile: ../../implementation/docker/transaction-service.Dockerfile
    depends_on:
      - account-service
    ports:
      - "8082:8082"

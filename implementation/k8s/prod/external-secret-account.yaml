apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: account-db-secret
  namespace: prod
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-secretstore
    kind: SecretStore
  target:
    name: account-db-secret
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: secret/data/account-service/db
        property: host
    - secretKey: port
      remoteRef:
        key: secret/data/account-service/db
        property: port
    - secretKey: username
      remoteRef:
        key: secret/data/account-service/db
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/account-service/db
        property: password
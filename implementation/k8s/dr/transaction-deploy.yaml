apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: dr
  labels:
    app: transaction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
      - name: transaction-service
        image: <ECR_REPO>/prod/transaction-service:<TAG>
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: SECRET_TOKEN
          valueFrom:
            secretKeyRef:
              name: transaction-secret
              key: token
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: dr
spec:
  type: ClusterIP
  selector:
    app: transaction-service
  ports:
  - port: 8082
    targetPort: 8082

apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: dev
  labels:
    app: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
      - name: account-service
        image: <ECR_REPO>/dev/account-service:<TAG>
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: account-db-secret
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: account-db-secret
              key: port
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: account-db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: account-db-secret
              key: password
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: account-service
  ports:
  - port: 8081
    targetPort: 8081